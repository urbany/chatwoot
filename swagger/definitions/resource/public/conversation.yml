type: object
properties:
  id:
    type: integer
    description: Id of the conversation
  uuid:
    type: string
    description: UUID of the conversation
  inbox_id:
    type: integer
    description: The inbox id of the conversation
  contact_last_seen_at:
    type: integer
    description: Timestamp of when the contact last seen the conversation (Unix timestamp)
  status:
    type: string
    enum: ['open', 'resolved', 'pending', 'snoozed']
    description: The status of the conversation
  agent_last_seen_at:
    type: integer
    description: Timestamp of when the agent last seen the conversation (Unix timestamp)
  messages:
    type: array
    items:
      $ref: '#/components/schemas/public_message'
    description: Messages in the conversation
  contact:
    $ref: '#/components/schemas/public_contact_record'
  group:
    type: boolean
    description: Whether this is a group conversation
  group_title:
    type: string
    description: Title/name of the group conversation
  group_source_id:
    type: string
    description: External identifier for the group (e.g., from WhatsApp or Telegram)
